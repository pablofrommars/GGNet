name: Publish NuGet package

# Tag-driven release. `v2.0.0-beta.1` publishes package version `2.0.0-beta.1`;
# workflow_dispatch takes the version explicitly so a release can be cut without
# moving a tag.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Package version, for example 2.0.0-beta.1
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Pack & publish GGNet
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Resolve package version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${DISPATCH_VERSION}"
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: ${version}" >&2
            exit 1
          fi

          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      # -p:Version overrides the <Version> in Directory.Build.props for this
      # build only, so package, assembly, and file versions stay in step.
      - name: Pack
        run: >-
          dotnet pack src/GGNet/GGNet.csproj
          --configuration Release
          --output artifacts
          -p:Version=${{ steps.version.outputs.value }}
          -p:RepositoryUrl=https://github.com/${{ github.repository }}
          -p:ContinuousIntegrationBuild=true

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*.nupkg

      - name: Publish to GitHub Packages
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
